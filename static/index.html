<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor de Inventario</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --txt:#1f2933; --mut:#6b7280; --pri:#2563eb; --ok:#16a34a; --bad:#dc2626; --bd:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Arial,sans-serif; background:var(--bg); color:var(--txt); }
  header { background:var(--pri); color:#fff; padding:16px 24px; }
  header h1 { margin:0; font-size:20px; } header p { margin:4px 0 0; opacity:.85; font-size:13px; }
  main { max-width:1100px; margin:24px auto; padding:0 16px; display:grid; gap:20px; grid-template-columns:340px 1fr; }
  @media (max-width:800px){ main{ grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:18px; }
  h2 { font-size:16px; margin:0 0 12px; }
  label { display:block; font-size:12px; color:var(--mut); margin:8px 0 3px; }
  input { width:100%; padding:8px; border:1px solid var(--bd); border-radius:6px; font-size:14px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button { cursor:pointer; border:0; border-radius:6px; padding:8px 12px; font-size:14px; background:var(--pri); color:#fff; }
  button.sec { background:#e5e7eb; color:var(--txt); } button.del { background:var(--bad); }
  button:disabled { opacity:.6; cursor:wait; }
  .acciones { display:flex; gap:8px; margin-top:14px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--bd); }
  th { color:var(--mut); font-weight:600; font-size:12px; }
  td button { padding:4px 8px; font-size:12px; }
  #msg { min-height:20px; font-size:13px; margin-top:10px; }
  .ok { color:var(--ok); } .err { color:var(--bad); }
  .tag { padding:2px 8px; border-radius:99px; font-size:12px; }
  .riesgo { background:#fee2e2; color:var(--bad); } .bien { background:#dcfce7; color:var(--ok); }
  .full { grid-column:1/-1; }
</style>
</head>
<body>
<header>
  <h1>📦 Gestor de Inventario</h1>
  <p>FastAPI · MongoDB Atlas (Motor) · asyncio.to_thread</p>
</header>

<main>
  <section class="card">
    <h2 id="tituloForm">Nuevo producto</h2>
    <form id="form">
      <input type="hidden" id="id">
      <label>SKU</label><input id="sku" required placeholder="LAP-001">
      <label>Nombre</label><input id="nombre" required placeholder="Laptop Lenovo">
      <label>Categoría</label><input id="categoria" required placeholder="Electrónica">
      <div class="row">
        <div><label>Precio</label><input id="precio" type="number" step="0.01" required></div>
        <div><label>Stock</label><input id="stock" type="number" required></div>
      </div>
      <label>Ventas diarias (promedio)</label><input id="ventas_diarias" type="number" step="0.1" value="1">
      <div class="acciones">
        <button type="submit" id="btnGuardar">Guardar</button>
        <button type="button" class="sec" onclick="limpiar()">Cancelar</button>
      </div>
      <div id="msg"></div>
    </form>
  </section>

  <section class="card">
    <h2>Productos</h2>
    <table>
      <thead><tr><th>SKU</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th></th></tr></thead>
      <tbody id="tabla"></tbody>
    </table>
  </section>

  <section class="card full">
    <h2>Proyección de stock (tarea pesada en hilo secundario)</h2>
    <div class="acciones" style="align-items:center">
      <label style="margin:0">Días:</label><input id="dias" type="number" value="30" style="width:90px">
      <button id="btnReporte" onclick="reporte()">Calcular proyección</button>
      <span id="pings" style="font-size:13px;color:var(--mut)"></span>
    </div>
    <div id="reporte" style="margin-top:12px"></div>
  </section>
</main>

<script>
const API = "/productos";
const $ = id => document.getElementById(id);
const campos = ["sku","nombre","categoria","precio","stock","ventas_diarias"];

function mensaje(t, ok=true){ $("msg").className = ok ? "ok" : "err"; $("msg").textContent = t; }

async function errorDe(r){
  const j = await r.json().catch(()=>({}));
  if (Array.isArray(j.detail)) return j.detail.map(e => `${e.loc.at(-1)}: ${e.msg}`).join(" | ");
  return j.detail || `Error ${r.status}`;
}

async function cargar(){
  const r = await fetch(API);
  const datos = await r.json();
  $("tabla").innerHTML = datos.map(p => `
    <tr>
      <td>${p.sku}</td><td>${p.nombre}</td><td>${p.categoria}</td>
      <td>$${p.precio.toFixed(2)}</td><td>${p.stock}</td>
      <td><button class="sec" onclick='editar(${JSON.stringify(p)})'>Editar</button>
          <button class="del" onclick="borrar('${p.id}','${p.nombre}')">Eliminar</button></td>
    </tr>`).join("") || `<tr><td colspan="6" style="color:var(--mut)">Sin productos</td></tr>`;
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const id = $("id").value;
  const body = {};
  campos.forEach(c => body[c] = $(c).type === "number" ? Number($(c).value) : $(c).value.trim());
  if (id) delete body.sku;  // el SKU no se modifica
  const r = await fetch(id ? `${API}/${id}` : API, {
    method: id ? "PUT" : "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });
  if (!r.ok) return mensaje(await errorDe(r), false);
  mensaje(id ? `Actualizado (HTTP ${r.status})` : `Creado (HTTP ${r.status})`);
  limpiar(false); cargar();
});

function editar(p){
  $("id").value = p.id; campos.forEach(c => $(c).value = p[c]);
  $("sku").disabled = true; $("tituloForm").textContent = "Editar producto";
}

function limpiar(borrarMsg=true){
  $("form").reset(); $("id").value = ""; $("sku").disabled = false;
  $("tituloForm").textContent = "Nuevo producto"; if (borrarMsg) $("msg").textContent = "";
}

async function borrar(id, nombre){
  const r = await fetch(`${API}/${id}`, {method:"DELETE"});
  if (!r.ok) return mensaje(await errorDe(r), false);
  mensaje(`"${nombre}" eliminado`); cargar();
}

async function reporte(){
  const btn = $("btnReporte"); btn.disabled = true; btn.textContent = "Calculando…";
  $("reporte").innerHTML = "";
  // Mientras el reporte corre en otro hilo, el servidor sigue respondiendo /ping
  let n = 0;
  const intervalo = setInterval(async () => {
    const p = await (await fetch("/ping")).json();
    $("pings").textContent = `Servidor respondiendo mientras calcula: ${++n} pings (${p.hora})`;
  }, 300);
  const r = await fetch(`/reportes/proyeccion-stock?dias=${$("dias").value}`);
  clearInterval(intervalo); btn.disabled = false; btn.textContent = "Calcular proyección";
  if (!r.ok) { $("reporte").innerHTML = `<span class="err">${await errorDe(r)}</span>`; return; }
  const d = await r.json();
  $("reporte").innerHTML = `
    <p>Proyección a <b>${d.dias}</b> días · <b>${d.en_riesgo}</b> producto(s) por agotarse · calculado en ${d.segundos}s</p>
    <table><thead><tr><th>SKU</th><th>Nombre</th><th>Stock actual</th><th>Stock proyectado</th><th>Se agota</th></tr></thead>
    <tbody>${d.productos.map(p => `<tr><td>${p.sku}</td><td>${p.nombre}</td><td>${p.stock_actual}</td>
      <td>${p.stock_proyectado}</td>
      <td><span class="tag ${p.reabastecer ? "riesgo" : "bien"}">${p.reabastecer ? "Día " + p.dia_agotado : "No"}</span></td></tr>`).join("")}
    </tbody></table>`;
}

cargar();
</script>
</body>
</html>
